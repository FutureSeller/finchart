name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm size
      - run: pnpm check:publish
      - run: pnpm exec changeset status

  # The packages declare `engines.node >=20.19` — the shipped dist must run
  # there, not only on the Node the repository builds with. Build on the
  # toolchain's Node, then run the consumer-side smokes on the floor.
  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19
      - run: node --version
      - run: node e2e/node-floor-smoke.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e
      - run: pnpm e2e
        working-directory: e2e

  react-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The repository catalog uses React 19. Exercise the declared peer floor
      # in this disposable CI checkout without changing the committed catalog.
      - run: pnpm --filter @finchart/react add -D react@18.0.0 react-dom@18.0.0 @types/react@^18.3.0 @types/react-dom@^18.3.0
      - run: pnpm --filter @finchart/react exec node -e 'if (require("react/package.json").version !== "18.0.0") process.exit(1)'
      - run: pnpm --filter @finchart/react... build
      - run: pnpm --filter @finchart/react type-check
      - run: pnpm --filter @finchart/react test
