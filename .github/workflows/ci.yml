name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Long sweeps stay in the local gate; CI keeps the focused regressions.
      - run: pnpm test:coverage
        env:
          FINCHART_SKIP_STRESS: "1"
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm size
      - run: pnpm check:publish
      # Version PRs consume changesets rather than add them. Match the bot,
      # branch, and repository together so a fork cannot claim this exception.
      - run: pnpm exec changeset status --since "$CHANGESET_BASE"
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.user.login != 'github-actions[bot]' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.head_ref != 'changeset-release/main'
        env:
          CHANGESET_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'main' }}

  # The packages declare `engines.node >=20.19` — the shipped dist must run
  # there, not only on the Node the repository builds with. Build on the
  # toolchain's Node, then run the consumer-side smokes on the floor.
  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.19
      - run: node --version
      - run: node e2e/node-floor-smoke.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e
      - run: pnpm e2e
        working-directory: e2e

  react-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The repository catalog uses React 19. Exercise the declared peer floor
      # in this disposable CI checkout without changing the committed catalog.
      - run: pnpm --filter @finchart/react add -D react@18.0.0 react-dom@18.0.0 @types/react@^18.3.0 @types/react-dom@^18.3.0
      - run: pnpm --filter @finchart/react exec node -e 'if (require("react/package.json").version !== "18.0.0") process.exit(1)'
      - run: pnpm --filter @finchart/react... build
      - run: pnpm --filter @finchart/react type-check
      - run: pnpm --filter @finchart/react test
