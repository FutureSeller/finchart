<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@finchart case gallery</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font: 14px/1.5 system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        background: var(--page, #f8fafc);
        color: var(--ink, #0f172a);
      }
      #layout { display: flex; gap: 20px; align-items: flex-start; }
      #list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 180px;
        position: sticky;
        top: 16px;
      }
      #list a {
        color: inherit;
        text-decoration: none;
        padding: 6px 10px;
        border-radius: 6px;
      }
      #list a.active { background: #3b82f6; color: #fff; }
      #main { flex: 1; min-width: 0; }
      #case-title { font-size: 18px; margin: 0 0 4px; }
      #case-description { margin: 0 0 12px; color: #64748b; font-size: 13px; }
      #stage {
        border: 1px solid var(--edge, #cbd5e1);
        border-radius: 8px;
        padding: 12px;
        background: var(--panel, #fff);
      }
      button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #94a3b8;
        border-radius: 6px;
        background: var(--button, #fff);
        color: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] { background: #3b82f6; color: #fff; }

      /* The dark theme — only CSS variables are swapped. The core reads them every frame. */
      body.dark {
        --page: #0b1220;
        --ink: #e2e8f0;
        --button: #1e293b;
        --edge: #334155;
        --panel: #0f172a;
      }
      body.dark a { color: #93c5fd; }
      /* The dark --chart-* values are consolidated in src/theme.css — what is
         swapped here is only the page chrome (--page, --ink and friends). */
    </style>
  </head>
  <body>
    <nav style="display: flex; gap: 16px; font-size: 14px; margin-bottom: 12px; align-items: center">
      <b>Case gallery</b>
      <a href="/">React wrapper</a>
      <a href="/trading.html">Trading screen (dogfooding)</a>
      <a href="/bench.html">Bench</a>
      <span style="flex: 1"></span>
      <button id="theme" type="button">Dark</button>
    </nav>
    <div id="layout">
      <nav id="list"></nav>
      <main id="main">
        <h1 id="case-title"></h1>
        <p id="case-description"></p>
        <div id="stage"></div>
      </main>
    </div>
    <script type="module" src="/src/cases-shell.ts"></script>
  </body>
</html>
